<text x="820.0" y="113" fill="#9aa5b4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" style="animation:fade .4s 0.90s both">36</text>
<rect x="330" y="124" width="640" height="22" rx="6" fill="#ffffff" fill-opacity=".04"/>
<rect x="330" y="124" width="466.7" height="22" rx="6" fill="url(#bl)" style="animation:grow 1.2s 0.15s cubic-bezier(.2,.8,.2,1) both"/>
