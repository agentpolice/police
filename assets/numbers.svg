<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="The numbers: top model without police versus low-cost model with police">
<defs><linearGradient id="bl" x1="0" x2="1"><stop offset="0" stop-color="#2f7dff"/><stop offset="1" stop-color="#5aa0ff"/></linearGradient></defs>
<style>@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes fade{from{opacity:0}to{opacity:1}}rect[style*=grow]{transform-box:fill-box;transform-origin:left center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1280" height="520" rx="24" fill="#070a10"/>
<text x="40" y="54" fill="#e9eef6" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="800">50 real tasks, run in sequence</text>
<rect x="760" y="34" width="16" height="16" rx="4" fill="#5b6675"/><text x="784" y="47" fill="#9aa5b4" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15">Top model, no police</text>
<rect x="960" y="34" width="16" height="16" rx="4" fill="#2f7dff"/><text x="984" y="47" fill="#cfe0ff" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700">Low-cost model + police</text>
<text x="40" y="116" fill="#e9eef6" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700">Correct (of 48)</text>
<text x="40" y="138" fill="#6b7686" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13">higher is better</text>
